[package]
name = "llm-client"
version = "0.1.0"
edition = "2021"
description = "OpenAI 兼容的大模型客户端：流式/非流式调用、SSE 解析、工具调用与压测指标"
license = "Apache-2.0"
repository = "https://github.com/ieayoio/llmperf"
readme = "README.md"
keywords = ["llm", "openai", "sse", "streaming", "benchmark"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
# SSE 原始字节缓冲
bytes = "1"
# 流式响应适配（unfold / StreamExt）
futures-util = "0.3"
# HTTP 客户端；gzip/brotli 用于兼容对 SSE 做压缩的网关
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# 超时与取消信号
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
# 测试用的本地 mock HTTP 服务 / 定时器
tokio = { version = "1", features = ["full"] }
